<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        /* =========================
           MAIN CARD
        ========================= */

        .card {
            width: 440px;
            max-width: 92%;

            padding: 35px;

            border-radius: 18px;

            background: white;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }


        /* =========================
           HEADING
        ========================= */

        h2 {
            margin: 0 0 8px 0;

            text-align: center;

            color: #1e293b;

            font-size: 30px;
        }

        .subtitle {
            margin: 0 0 28px 0;

            text-align: center;

            color: #64748b;

            font-size: 17px;
        }


        /* =========================
           INPUT FIELDS
        ========================= */

        input[type="text"],
        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding: 14px;

            margin-top: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {

            border-color: #2563eb;

            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.10);
        }


        /* =========================
           INSTITUTION TYPE
        ========================= */

        .institution-section {

            width: 100%;

            margin-top: 25px;

            margin-bottom: 20px;
        }

        .institution-title {

            text-align: left;

            font-size: 18px;

            font-weight: 700;

            color: #1e293b;

            margin-bottom: 14px;

            letter-spacing: 0.5px;
        }


        /* SCHOOL / COLLEGE CONTAINER */

        .institution-options {

            display: flex;

            gap: 14px;

            width: 100%;
        }


        /* EACH OPTION */

        .institution-option {

            flex: 1;

            position: relative;
        }


        /* HIDE RADIO BUTTON */

        .institution-option input[type="radio"] {

            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        /* OPTION BOX */

        .institution-option label {

            width: 100%;

            min-height: 105px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            border: 2px solid #cbd5e1;

            border-radius: 12px;

            background: #ffffff;

            cursor: pointer;

            transition: all 0.25s ease;
        }


        /* HOVER */

        .institution-option label:hover {

            border-color: #2563eb;

            transform: translateY(-2px);

            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.12);
        }


        /* SELECTED OPTION */

        .institution-option input[type="radio"]:checked + label {

            border-color: #2563eb;

            background: #eff6ff;

            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.18);
        }


        /* ICON */

        .institution-icon {

            font-size: 32px;

            margin-bottom: 7px;
        }


        /* SCHOOL / COLLEGE TEXT */

        .institution-name {

            font-size: 16px;

            font-weight: 700;

            color: #1e293b;

            letter-spacing: 0.5px;
        }


        /* =========================
           BUTTON
        ========================= */

        button {

            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            background: #1d4ed8;

            transform: translateY(-1px);
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error {

            margin-top: 12px;

            padding: 10px;

            color: #dc2626;

            background: #fee2e2;

            border-radius: 7px;

            text-align: center;

            font-size: 14px;
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .link {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;
        }

        a {

            color: #2563eb;

            text-decoration: none;
        }

        a:hover {

            text-decoration: underline;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            .card {

                padding: 25px;

            }

            h2 {

                font-size: 26px;

            }

            .institution-options {

                flex-direction: column;

            }

            .institution-option label {

                min-height: 90px;

            }
        }

    </style>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='theme.css') }}"
>

</head>


<body>

    <div class="card">

        <!-- =========================
             TITLE
        ========================= -->

        <h2>Create Account</h2>

        <p class="subtitle">
            Automated Attendance System
        </p>


        <!-- =========================
             SIGNUP FORM
        ========================= -->

        <form method="POST" action="{{ url_for('signup') }}">


            <!-- FULL NAME -->

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
            >


            <!-- USERNAME -->

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >


            <!-- EMAIL -->

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >


            <!-- PASSWORD -->

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >


            <!-- CONFIRM PASSWORD -->

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >


            <!-- =========================
                 INSTITUTION TYPE
            ========================= -->

            <div class="institution-section">

                <div class="institution-title">
                    INSTITUTION TYPE
                </div>


                <div class="institution-options">


                    <!-- SCHOOL -->

                    <div class="institution-option">

                        <input
                            type="radio"
                            id="school"
                            name="institution_type"
                            value="school"
                            required
                        >

                        <label for="school">

                            <span class="institution-icon">
                                🏫
                            </span>

                            <span class="institution-name">
                                SCHOOL
                            </span>

                        </label>

                    </div>


                    <!-- COLLEGE -->

                    <div class="institution-option">

                        <input
                            type="radio"
                            id="college"
                            name="institution_type"
                            value="college"
                        >

                        <label for="college">

                            <span class="institution-icon">
                                🎓
                            </span>

                            <span class="institution-name">
                                COLLEGE
                            </span>

                        </label>

                    </div>

                </div>

            </div>


            <!-- =========================
                 CREATE ACCOUNT BUTTON
            ========================= -->

            <button type="submit">
                Create Account
            </button>


        </form>


        <!-- =========================
             ERROR MESSAGE
        ========================= -->

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <!-- =========================
             LOGIN LINK
        ========================= -->

        <div class="link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</body>

<script
    src="{{ url_for('static', filename='theme.js') }}"
></script>

</html>
