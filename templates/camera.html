<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Face Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 700px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        .student-info {
            background: #eeeeee;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        video {
            width: 600px;
            max-width: 100%;
            border-radius: 10px;
            border: 4px solid #333;
            background: black;
        }

        button {
            padding: 12px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        #startCamera {
            background: #007bff;
            color: white;
        }

        #capture {
            background: #28a745;
            color: white;
        }

        #back {
            background: #6c757d;
            color: white;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📷 Face Registration</h1>

    <div class="student-info">

        <p>
            <b>Student ID:</b>
            {{ student[0] }}
        </p>

        <p>
            <b>Name:</b>
            {{ student[1] }}
        </p>

        <p>
            <b>Class:</b>
            {{ student[2] }}
        </p>

        <p>
            <b>Section:</b>
            {{ student[3] }}
        </p>

    </div>

    <video id="video" autoplay playsinline></video>

    <br>

    <button id="startCamera">
        📷 Start Camera
    </button>

    <button id="capture">
        📸 Capture Face
    </button>

    <button id="back">
        ← Back
    </button>

    <canvas id="canvas"></canvas>

    <div id="message"></div>

</div>


<script>

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const startCamera =
    document.getElementById("startCamera");

const capture =
    document.getElementById("capture");

const back =
    document.getElementById("back");

const message =
    document.getElementById("message");

let stream = null;


// START CAMERA

startCamera.onclick = async function() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        video.srcObject = stream;

        message.innerHTML =
            "🟢 Camera started successfully.";

    }

    catch (error) {

        console.log(error);

        message.innerHTML =
            "❌ Camera permission denied.";

    }

};


// CAPTURE FACE

capture.onclick = function() {

    if (stream === null) {

        message.innerHTML =
            "⚠️ Start the camera first.";

        return;

    }

    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;

    const context =
        canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.toBlob(function(blob) {

        const formData =
            new FormData();

        formData.append(
            "image",
            blob,
            "face.jpg"
        );

        message.innerHTML =
            "⏳ Checking face...";


        fetch(
            "/save_face/{{ student[0] }}",
            {
                method: "POST",
                body: formData
            }
        )

        .then(function(response) {

            return response.json();

        })

        .then(function(data) {

            message.innerHTML =
                data.message;

        })

        .catch(function(error) {

            console.log(error);

            message.innerHTML =
                "❌ Error sending image.";

        });

    }, "image/jpeg");

};


// BACK

back.onclick = function() {

    if (stream) {

        stream.getTracks().forEach(
            function(track) {
                track.stop();
            }
        );

    }

    window.location.href = "/students";

};

</script>

</body>

</html>
