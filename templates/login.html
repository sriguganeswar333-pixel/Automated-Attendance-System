<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Attendance System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f4f7fb;
        }

        .login-box {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {

            text-align: center;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        .signup-link {

            text-align: center;

            margin-top: 18px;
        }

        .signup-link a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;
        }

        .success {

            background: #dcfce7;

            color: #15803d;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='theme.css') }}"
>

</head>

<body>

<div class="login-box">

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Automated Attendance System
    </p>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    {% if success %}

        <div class="success">
            {{ success }}
        </div>

    {% endif %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="signup-link">

        Don't have an account?

        <a href="{{ url_for('signup') }}">
            Create Account
        </a>

    </div>

</div>

</body>

<script
    src="{{ url_for('static', filename='theme.js') }}"
></script>

</html>
